name: Windows build

# Compiles vdsd/vdsctl for Windows (MSVC + vcpkg Opus) and runs the tests on
# every push, so the Windows daemon keeps building alongside the Linux one.
# The binaries are uploaded for the OpenDS5 Windows installer.

on:
  push:
    branches: [main, windows]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: vdsd (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Locate vcpkg
        shell: pwsh
        run: |
          $Vcpkg = Get-Command vcpkg.exe -ErrorAction SilentlyContinue
          $VcpkgPath = if ($Vcpkg) { $Vcpkg.Source } else { "C:\vcpkg\vcpkg.exe" }
          "VDS_VCPKG_ROOT=$(Split-Path -Parent $VcpkgPath)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build\windows `
            -DCMAKE_TOOLCHAIN_FILE="$env:VDS_VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"
          cmake --build build\windows --config Release --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build\windows -C Release --output-on-failure

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: vdsd-windows
          path: |
            build/windows/Release/*.exe
            build/windows/Release/*.dll
          if-no-files-found: error
