name: Windows build

# Compiles vdsd/vdsctl for Windows (MSVC + vcpkg Opus) and runs the tests on
# every push, so the Windows daemon keeps building alongside the Linux one.
# The binaries are uploaded for the OpenDS5 Windows installer.

on:
  push:
    branches: [main, windows]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: vdsd (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Locate vcpkg
        shell: pwsh
        run: |
          $Vcpkg = Get-Command vcpkg.exe -ErrorAction SilentlyContinue
          $VcpkgPath = if ($Vcpkg) { $Vcpkg.Source } else { "C:\vcpkg\vcpkg.exe" }
          "VDS_VCPKG_ROOT=$(Split-Path -Parent $VcpkgPath)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build\windows `
            -DCMAKE_TOOLCHAIN_FILE="$env:VDS_VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"
          cmake --build build\windows --config Release --parallel

      - name: Test
        shell: pwsh
        run: ctest --test-dir build\windows -C Release --output-on-failure

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: vdsd-windows
          path: |
            build/windows/Release/*.exe
            build/windows/Release/*.dll
          if-no-files-found: error

      # The self-contained build OpenDS5 bundles: static C++ runtime and Opus,
      # so the installer needs no Visual C++ Redistributable.
      - name: Build (static, for OpenDS5)
        shell: pwsh
        run: |
          cmake -S . -B build\static `
            -DVDS_STATIC_MSVC_RUNTIME=ON `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_TOOLCHAIN_FILE="$env:VDS_VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake"
          cmake --build build\static --config Release --parallel --target vdsd vdsctl
          $Dlls = Get-ChildItem build\static\Release\*.dll -ErrorAction SilentlyContinue
          if ($Dlls) { throw "static build still needs: $($Dlls.Name -join ', ')" }

      - name: Upload static binaries
        uses: actions/upload-artifact@v7
        with:
          name: vdsd-windows-static
          path: build/static/Release/*.exe
          if-no-files-found: error
